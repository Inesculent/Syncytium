[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "syncytium"
dynamic = ["version"]
description = "Functional low-precision LLM shards that rebuild their parent model."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Inesculent" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Install PyTorch first from the index matching your CUDA version (see README).
dependencies = [
    "torch>=2.9",
    "safetensors>=0.5",
]

[project.optional-dependencies]
# Phase 1: model loading and perplexity evaluation.
experiments = [
    "transformers>=5.2", # first release with Qwen3.5 (qwen3_5) support
    "accelerate>=1.10",
    "datasets>=3.0",
]
# Summary tables and paper figures from sweep results.
report = [
    "pandas>=2.2",
    "matplotlib>=3.9",
    "tabulate>=0.9", # pandas.DataFrame.to_markdown
]
# Writing children as GGUF files that run in stock llama.cpp.
export = [
    "gguf>=0.17",
]
# Phase 2: container roles, heartbeats and shard transfer.
harness = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[project.scripts]
syncytium-sweep = "syncytium.sweep.cli:main"
syncytium-report = "syncytium.report.cli:main"
syncytium-compare = "syncytium.report.cli:compare_main"
syncytium-shard = "syncytium.shards.cli:main"
syncytium-rebuild = "syncytium.shards.cli:rebuild_main"
syncytium-pool = "syncytium.pool.cli:main"

[tool.hatch.version]
path = "src/syncytium/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/syncytium"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "N",        # naming
    "D",        # docstrings
    "UP",       # modern syntax
    "B",        # likely bugs
    "SIM",      # simplifications
    "C90",      # cyclomatic complexity
    "PLR",      # size limits: arguments, branches, statements
    "RUF",
]
ignore = [
    "D105",     # magic-method docstrings
    "D107",     # __init__ arguments are documented in the class docstring
    "PLR2004",  # numeric constants are common in quantization math
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 10
max-statements = 35
