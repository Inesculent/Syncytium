# Quick end-to-end check of the sweep pipeline: one setting, 16 windows (about 5 minutes).
name = "screen-0.8b"
output = "results/screen-0.8b"

[model]
path = "Qwen/Qwen3.5-0.8B-Base"

[eval]
window = 2048
max_windows = 16

[grid]
bits = [4]
group_sizes = [64]
children = [4]
phases = [0.0, 0.5]
max_missing = 1
rtn_bits = [4]
