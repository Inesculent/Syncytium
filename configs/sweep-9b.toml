# Main sweep (stage 1.6) at 9B. Same grid as the pilot; runs after the pilot fixes the
# usable-child threshold in docs/hypothesis.md.
name = "sweep-9b"
output = "results/sweep-9b"

[model]
path = "Qwen/Qwen3.5-9B-Base"

[eval]
window = 2048

[grid]
bits = [2, 3, 4]
group_sizes = [64]
children = [2, 4, 8]
phases = [0.0, 0.5]
rotation = [false, true]
seed = 0
max_missing = 1
rtn_bits = [2, 3, 4, 5, 6, 7, 8]
